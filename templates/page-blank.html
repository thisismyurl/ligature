<!-- Blank canvas page template for Ligature.
     No header. No footer. No constrained wrapper.

     DOCUMENTED STRUCTURAL VARIATION (gate Check 13, documented-variation clause):
     This is a deliberate full-bleed template, not an accidental omission. It is
     the one template that intentionally ships without the header and footer
     parts, because its job is custom landing pages, coming-soon screens, and
     full-bleed presentations that must own the entire viewport with no theme
     chrome. The WCAG navigation scaffold is still intact: an explicit single
     <main id="main-content"> landmark (the skip-link target) and an explicit
     level-1 heading block below. Editors who want site navigation on a page
     should choose page.html or page-wide.html instead; both ship the header and
     footer. To restore chrome here, add the header and footer template-part
     blocks back around the <main>.

     Pillar 7 (High Agency): the designer has full control of the canvas.
     No chrome forced. No gutters imposed. -->

<!-- wp:group {"tagName":"main","id":"main-content","className":"ligature-main ligature-page-blank","layout":{"type":"default"}} -->
<main id="main-content" class="wp-block-group ligature-main ligature-page-blank">

	<!-- Page heading (required per WCAG 2.1 1.3.1). Empty by design; add a title
	     in the Site Editor. Do not delete this block. -->
	<!-- wp:heading {"level":1} -->
	<h1></h1>
	<!-- /wp:heading -->
	<!-- wp:post-content {"layout":{"type":"default"}} /-->
</main>
<!-- /wp:group -->
